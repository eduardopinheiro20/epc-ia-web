<div class="min-h-screen flex items-center justify-center bg-gray-900 text-white">
  <div class="w-full max-w-md bg-gray-800 p-6 rounded-xl shadow-lg">

    <h2 class="text-2xl font-bold text-center text-emerald-400 mb-6">
        Login
    </h2>

    <form (ngSubmit)="login()" class="space-y-4">

      <div>
        <label class="text-sm text-gray-300">Email</label>
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          required
          class="w-full mt-1 px-3 py-2 rounded bg-gray-700 text-white outline-none"
        />
      </div>

      <div>
        <label class="text-sm text-gray-300">Senha</label>
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          required
          class="w-full mt-1 px-3 py-2 rounded bg-gray-700 text-white outline-none"
        />
      </div>

      <div *ngIf="error" class="text-red-400 text-sm text-center">
        {{ error }}
      </div>

      <button
        type="submit"
        [disabled]="loading"
        class="w-full bg-emerald-500 hover:bg-emerald-600 py-2 rounded font-bold"
      >
        {{ loading ? 'Entrando...' : 'Entrar' }}
      </button>
      <p class="text-sm text-gray-400 mt-4">
        Não tem conta?
        <a routerLink="/register" class="text-emerald-400 hover:underline">
            Criar conta
        </a>
      </p>
    
    </form>
  </div>
</div>
